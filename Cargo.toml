[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/bgkillas/helix"

[profile.release]
lto = true
strip = true
panic = "abort"
incremental = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1

[workspace]
resolver = "3"
members = ["better_explosions/better_explosions", "better_explosions/shapes", "better_explosions/viewer", "helix", "noita_api", "noita_api_macros"]
default-members = ["better_explosions/better_explosions", "helix", "noita_api", "noita_api_macros"]

[workspace.dependencies]
noita_api = {path = "noita_api"}
noita_api_macros = {path = "noita_api_macros"}
better_explosions = {path = "better_explosions/better_explosions"}
shapes = {path = "better_explosions/shapes"}

[workspace.lints.clippy]
pedantic = {level = "warn", priority = -1}
shadow_reuse = "warn"
unused_trait_names = "warn"
missing_inline_in_public_items = "warn"
as-conversions = "warn"
str-to-string = "warn"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
too_many_lines = "allow"
missing_fields_in_debug = "allow"
missing_safety_doc = "allow"
similar-names = "allow"
